<!doctype html>
<html lang="de" data-feedback-lang="en" class="hwq-eink">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mein Wochenende — Deutsch A2/B1</title>
  <style>
    body { max-width: 820px; margin: 0 auto; padding: 0 1rem 3rem; font-family: system-ui, -apple-system, sans-serif; line-height: 1.55; background: #fff; color: #000; }
    section { margin: 1.35rem 0; }
    h2 { font-size: 1.06rem; margin: 0 0 0.3rem; }
    p { margin: 0.25rem 0 0.5rem; }
  </style>
</head>
<body>
  <pen-toolbar></pen-toolbar>
  <pen-header subtitle="Schreib mit der Hand auf Deutsch · Feedback arrives in English with spelling, capitals, and umlauts checked." student-name></pen-header>

  <section>
    <h2>1. Korrigiere die drei Fehler im Satz</h2>
    <p><em>„Gestern ich habe in den park gegangen und ein buch gelesen.“</em></p>
    <pen-input
      name="q1"
      label="Satzkorrektur (Perfekt & Verbposition)"
      points="3"
      rubric="Verb an Position 2 nach 'Gestern' | Hilfsverb 'bin' bei 'gegangen' | Nomen großgeschrieben (Park, Buch)"
      hint="Nach einer Zeitangabe am Satzanfang (*Gestern*) steht das konjugierte Verb direkt an Position 2, und *gehen* bildet das Perfekt mit **sein**."
      paper="ruled"
      height="320"
      confidence
    ></pen-input>
  </section>

  <section>
    <h2>2. Schreib 3–4 Sätze über dein letztes Wochenende</h2>
    <p>Benutze mindestens einmal <strong>weil</strong> (Nebensatz mit Verb am Ende!) und mindestens zwei Verben im Perfekt.</p>
    <pen-input
      name="q2"
      label="Kurzer Text: Mein Wochenende"
      points="5"
      rubric="Mindestens 3 vollständige Sätze | Korrekter 'weil'-Nebensatz (Verb am Ende) | Mindestens 2 Perfektformen | Großschreibung & Umlaute"
      hint="Beispiel für *weil*: „Ich bin zu Hause geblieben, **weil** es geregnet **hat**.“"
      paper="ruled"
      height="460"
      confidence
    ></pen-input>
  </section>

  <pen-submit agent="Deutschlehrer" prompt="Explain grammar and word-order slips warmly in English while keeping corrected example sentences in natural German. Always point out noun capitalization and umlaut slips.">Abgeben</pen-submit>
  <script src="../dist/pen-sheet.js"></script>
</body>
</html>
