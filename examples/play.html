<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>pen-sheet Shared Worksheet</title>
</head>
<body>
  <div id="root"></div>
  <script>
    const SVG_TEMPLATES = {
      numberline: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 130"><line x1="24" y1="72" x2="396" y2="72" stroke="#000" stroke-width="2"/><line x1="60" y1="62" x2="60" y2="82" stroke="#000" stroke-width="2"/><text x="60" y="104" text-anchor="middle" font-family="sans-serif" font-size="18">-3</text><line x1="110" y1="62" x2="110" y2="82" stroke="#000" stroke-width="2"/><text x="110" y="104" text-anchor="middle" font-family="sans-serif" font-size="18">-2</text><line x1="160" y1="62" x2="160" y2="82" stroke="#000" stroke-width="2"/><text x="160" y="104" text-anchor="middle" font-family="sans-serif" font-size="18">-1</text><line x1="210" y1="58" x2="210" y2="86" stroke="#000" stroke-width="3"/><text x="210" y="104" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">0</text><line x1="260" y1="62" x2="260" y2="82" stroke="#000" stroke-width="2"/><text x="260" y="104" text-anchor="middle" font-family="sans-serif" font-size="18">1</text><line x1="310" y1="62" x2="310" y2="82" stroke="#000" stroke-width="2"/><text x="310" y="104" text-anchor="middle" font-family="sans-serif" font-size="18">2</text><line x1="360" y1="62" x2="360" y2="82" stroke="#000" stroke-width="2"/><text x="360" y="104" text-anchor="middle" font-family="sans-serif" font-size="18">3</text></svg>`,
      axes: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 300"><g stroke="#cbd5e1" stroke-width="1"><line x1="60" y1="30" x2="60" y2="270"/><line x1="100" y1="30" x2="100" y2="270"/><line x1="140" y1="30" x2="140" y2="270"/><line x1="180" y1="30" x2="180" y2="270"/><line x1="260" y1="30" x2="260" y2="270"/><line x1="300" y1="30" x2="300" y2="270"/><line x1="340" y1="30" x2="340" y2="270"/><line x1="380" y1="30" x2="380" y2="270"/><line x1="40" y1="70" x2="400" y2="70"/><line x1="40" y1="110" x2="400" y2="110"/><line x1="40" y1="190" x2="400" y2="190"/><line x1="40" y1="230" x2="400" y2="230"/></g><line x1="40" y1="150" x2="406" y2="150" stroke="#000" stroke-width="2.5"/><text x="414" y="156" font-family="serif" font-size="18" font-style="italic">x</text><line x1="220" y1="24" x2="220" y2="276" stroke="#000" stroke-width="2.5"/><text x="228" y="34" font-family="serif" font-size="18" font-style="italic">y</text></svg>`,
      table: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150"><rect x="16" y="16" width="568" height="118" fill="#fff" stroke="#000" stroke-width="2"/><line x1="16" y1="72" x2="584" y2="72" stroke="#000" stroke-width="2"/><line x1="110" y1="16" x2="110" y2="134" stroke="#000" stroke-width="2"/><line x1="204" y1="16" x2="204" y2="134" stroke="#000" stroke-width="1.5"/><line x1="298" y1="16" x2="298" y2="134" stroke="#000" stroke-width="1.5"/><line x1="392" y1="16" x2="392" y2="134" stroke="#000" stroke-width="1.5"/><line x1="486" y1="16" x2="486" y2="134" stroke="#000" stroke-width="1.5"/></svg>`,
      venn: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 260"><circle cx="195" cy="135" r="95" fill="none" stroke="#000" stroke-width="2.5"/><circle cx="305" cy="135" r="95" fill="none" stroke="#000" stroke-width="2.5"/><text x="140" y="36" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">A</text><text x="360" y="36" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold">B</text></svg>`,
    };

    function fromBase64Url(s) {
      const pad = s.length % 4 ? "=".repeat(4 - (s.length % 4)) : "";
      const bin = atob(s.replaceAll("-", "+").replaceAll("_", "/") + pad);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    async function decodeSpec(hash) {
      const raw = String(hash || "").replace(/^#/, "");
      if (raw.startsWith("z=") && typeof DecompressionStream === "function") {
        const bytes = fromBase64Url(raw.slice(2));
        const ds = new DecompressionStream("deflate-raw");
        const stream = new Blob([bytes]).stream().pipeThrough(ds);
        return JSON.parse(await new Response(stream).text());
      }
      if (raw.startsWith("j=")) {
        return JSON.parse(new TextDecoder().decode(fromBase64Url(raw.slice(2))));
      }
      return null;
    }

    function sanitizeSvg(raw) {
      if (typeof raw !== "string" || !raw.trim().startsWith("<svg")) return null;
      const doc = new DOMParser().parseFromString(raw, "image/svg+xml");
      if (doc.querySelector("parsererror")) return null;
      const svg = doc.documentElement;
      if (svg.localName !== "svg") return null;
      svg.querySelectorAll("script, foreignObject, iframe, object, embed").forEach((el) => el.remove());
      for (const el of [svg, ...svg.querySelectorAll("*")]) {
        for (const attr of [...el.attributes]) {
          const name = attr.name.toLowerCase();
          if (name.startsWith("on") || /^\s*javascript:/i.test(attr.value)) el.removeAttribute(attr.name);
        }
      }
      return svg.outerHTML;
    }

    async function boot() {
      const root = document.getElementById("root");
      let spec;
      try {
        spec = await decodeSpec(location.hash);
      } catch (err) {
        root.textContent = "Could not open this shared worksheet link (corrupted or unsupported payload).";
        return;
      }
      if (!spec || !Array.isArray(spec.questions) || !spec.questions.length) {
        root.innerHTML = `<div style="max-width:600px;margin:3rem auto;font-family:system-ui,sans-serif;padding:0 1rem"><h1>pen-sheet Shared Worksheet Runner</h1><p>This link has no worksheet payload yet. Build a worksheet in the <a href="./builder.html">Worksheet Studio</a> and click <strong>🔗 Share Link</strong> to generate an instant shareable URL.</p></div>`;
        return;
      }

      document.title = String(spec.title || "Stylus Worksheet");
      document.documentElement.lang = String(spec.lang || "en");
      if (spec.fblang) document.documentElement.dataset.feedbackLang = String(spec.fblang);
      if (spec.eink !== false) document.documentElement.classList.add("hwq-eink");
      if (spec.wide) document.documentElement.classList.add("pen-wide");

      const toolbar = document.createElement("pen-toolbar");
      if (Number(spec.timer) > 0) toolbar.setAttribute("timer", String(Math.round(Number(spec.timer))));
      const header = document.createElement("pen-header");
      if (spec.sub) header.setAttribute("subtitle", String(spec.sub));
      if (spec.name) header.setAttribute("student-name", "");

      const frag = document.createDocumentFragment();
      frag.append(toolbar, header);
      if (spec.ref && String(spec.ref).trim()) {
        const refEl = document.createElement("pen-reference");
        refEl.setAttribute("title", "Formula Sheet");
        refEl.textContent = String(spec.ref).trim();
        frag.append(refEl);
      }

      spec.questions.forEach((q, idx) => {
        const sec = document.createElement("section");
        const h2 = document.createElement("h2");
        h2.textContent = String(q.heading || `${idx + 1}. Question`);
        sec.append(h2);
        if (q.prompt) {
          const p = document.createElement("p");
          p.textContent = String(q.prompt);
          sec.append(p);
        }
        const pen = document.createElement("pen-input");
        pen.setAttribute("name", `q${idx + 1}`);
        if (q.label) pen.setAttribute("label", String(q.label));
        if (Number(q.points) > 0) pen.setAttribute("points", String(q.points));
        if (q.rubric) pen.setAttribute("rubric", String(q.rubric));
        if (q.hint) pen.setAttribute("hint", String(q.hint));
        if (q.solution) pen.setAttribute("solution", String(q.solution));
        if (q.say) pen.setAttribute("say", String(q.say));
        if (spec.conf) pen.setAttribute("confidence", "");
        const svg = SVG_TEMPLATES[q.svg] || (q.customSvg ? sanitizeSvg(q.customSvg) : null);
        if (svg) {
          pen.innerHTML = svg;
        } else {
          pen.setAttribute("paper", ["grid", "ruled", "blank"].includes(q.paper) ? q.paper : "ruled");
          pen.setAttribute("height", String(Math.max(200, Math.min(900, Number(q.height) || 400))));
        }
        sec.append(pen);
        frag.append(sec);
      });

      const submit = document.createElement("pen-submit");
      if (["coach", "free", "strict"].includes(spec.mode) && spec.mode !== "coach") submit.setAttribute("mode", spec.mode);
      if (spec.exam) submit.setAttribute("exam", "");
      if (spec.aiHints && !spec.exam) submit.setAttribute("ai-hints", "");
      if (spec.prompt) submit.setAttribute("prompt", String(spec.prompt));
      submit.textContent = "Hand in for coaching";
      frag.append(submit);

      root.replaceWith(frag);
      const s = document.createElement("script");
      s.src = "../dist/pen-sheet.js";
      document.body.append(s);
    }

    boot();
  </script>
</body>
</html>
